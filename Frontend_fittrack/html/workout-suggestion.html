<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack – Workout Suggestions</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#080808; --sidebar:#0b0b0b; --surface:#111113; --surface2:#18181b;
      --border:#222226; --border2:#2a2a2f; --text:#f4f4f5; --muted:#71717a;
      --yellow:#fbbf24; --yellow-dim:rgba(251,191,36,0.12);
      --green:#22c55e; --red:#f87171; --blue:#60a5fa;
    }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; overflow-x:hidden; }

    /* SIDEBAR */
    .sidebar { position:fixed; left:0; top:0; width:260px; height:100vh; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:24px 16px; z-index:100; }
    .logo-wrap { display:flex; align-items:center; gap:12px; padding:0 8px; margin-bottom:32px; }
    .logo-icon { width:40px; height:40px; background:var(--yellow); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .logo-text { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; letter-spacing:2px; }
    .logo-text span { color:var(--yellow); }
    .logo-sub { font-size:10px; color:var(--muted); letter-spacing:1px; }
    .menu { list-style:none; flex:1; display:flex; flex-direction:column; gap:4px; }
    .menu li { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; color:var(--muted); cursor:pointer; font-size:13.5px; font-weight:500; transition:all .2s; }
    .menu li:hover { background:var(--surface2); color:var(--text); }
    .menu li.active { background:var(--yellow); color:#000; font-weight:700; }
    .menu li .icon { font-size:15px; width:18px; text-align:center; }

    /* LOGOUT */
    .logout-btn { position:fixed; top:16px; right:20px; background:var(--yellow); color:#000; font-weight:700; font-size:13px; padding:9px 20px; border-radius:8px; border:none; cursor:pointer; z-index:200; font-family:'DM Sans',sans-serif; transition:background .2s; }
    .logout-btn:hover { background:#d97706; }

    /* MAIN */
    .main { margin-left:260px; flex:1; padding:32px 28px; overflow-y:auto; }

    .page-head { margin-bottom:28px; }
    .page-head h1 { font-family:'Syne',sans-serif; font-size:1.7rem; font-weight:800; margin-bottom:4px; }
    .page-head p { color:var(--muted); font-size:.88rem; }

    /* TWO-COL LAYOUT */
    .layout { display:grid; grid-template-columns:1fr 1.4fr; gap:24px; align-items:start; }
    @media(max-width:1000px){ .layout{ grid-template-columns:1fr; } }

    /* COMPOSE CARD */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; }
    .card h2 { font-family:'Syne',sans-serif; font-size:1.05rem; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:8px; }

    .field { margin-bottom:16px; }
    .field label { display:block; font-size:.78rem; color:var(--muted); margin-bottom:6px; font-weight:500; }
    .field input, .field select, .field textarea {
      width:100%; background:#09090b; border:1px solid var(--border2); border-radius:10px;
      padding:10px 14px; color:var(--text); font-size:.88rem; font-family:'DM Sans',sans-serif;
      outline:none; transition:border .2s; resize:vertical;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--yellow); }
    .field textarea { min-height:90px; }
    .field select option { background:#09090b; }

    /* CLIENT CHECKBOXES */
    .client-list { display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; padding-right:4px; }
    .client-list::-webkit-scrollbar { width:4px; }
    .client-list::-webkit-scrollbar-track { background:transparent; }
    .client-list::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:99px; }

    .client-check {
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      background:#09090b; border:1px solid var(--border2); border-radius:10px;
      cursor:pointer; transition:border-color .2s;
    }
    .client-check:hover { border-color:#444; }
    .client-check.selected { border-color:var(--yellow); background:rgba(251,191,36,0.06); }
    .client-check input[type=checkbox] { accent-color:var(--yellow); width:15px; height:15px; cursor:pointer; }
    .cc-av { width:32px; height:32px; border-radius:50%; background:var(--yellow); color:#000; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .cc-info { flex:1; min-width:0; }
    .cc-name { font-size:.88rem; font-weight:600; }
    .cc-meta { font-size:.75rem; color:var(--muted); }

    .all-row { display:flex; align-items:center; gap:8px; padding:8px 12px; margin-bottom:4px; cursor:pointer; color:var(--muted); font-size:.82rem; }
    .all-row input { accent-color:var(--yellow); }
    .all-row:hover { color:var(--text); }

    .no-clients { color:var(--muted); font-size:.85rem; text-align:center; padding:24px 0; }

    /* TAG PILLS */
    .tag-grid { display:flex; flex-wrap:wrap; gap:8px; }
    .tag-pill {
      padding:6px 14px; border-radius:99px; border:1px solid var(--border2);
      background:transparent; color:var(--muted); font-size:.78rem; cursor:pointer;
      font-family:'DM Sans',sans-serif; transition:all .2s;
    }
    .tag-pill:hover { border-color:#555; color:var(--text); }
    .tag-pill.active { background:var(--yellow); border-color:var(--yellow); color:#000; font-weight:700; }

    /* SUBMIT */
    .send-btn {
      width:100%; padding:13px; background:var(--yellow); color:#000; font-weight:700;
      font-size:.95rem; border:none; border-radius:10px; cursor:pointer;
      font-family:'Syne',sans-serif; letter-spacing:.5px; transition:background .2s, transform .1s;
      margin-top:4px;
    }
    .send-btn:hover { background:#d97706; }
    .send-btn:active { transform:scale(0.98); }
    .send-btn:disabled { background:#333; color:#666; cursor:not-allowed; }

    .toast {
      position:fixed; bottom:28px; right:28px; background:var(--green); color:#000;
      font-weight:700; font-size:.88rem; padding:12px 22px; border-radius:10px;
      transform:translateY(80px); opacity:0; transition:all .3s; z-index:999;
    }
    .toast.show { transform:translateY(0); opacity:1; }

    /* SENT SUGGESTIONS LIST */
    .filter-row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .filter-btn { padding:6px 14px; border-radius:99px; border:1px solid var(--border2); background:transparent; color:var(--muted); font-size:.78rem; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all .2s; }
    .filter-btn:hover { color:var(--text); border-color:#555; }
    .filter-btn.active { background:var(--yellow); border-color:var(--yellow); color:#000; font-weight:700; }

    .suggestion-list { display:flex; flex-direction:column; gap:10px; }

    .sug-item {
      background:#09090b; border:1px solid var(--border2); border-radius:12px;
      padding:16px; display:flex; gap:14px; align-items:flex-start;
      animation:fadeUp .3s ease both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .sug-dot { width:10px; height:10px; border-radius:50%; background:var(--yellow); margin-top:5px; flex-shrink:0; }
    .sug-body { flex:1; min-width:0; }
    .sug-title { font-size:.9rem; font-weight:700; margin-bottom:3px; }
    .sug-desc { font-size:.8rem; color:var(--muted); margin-bottom:8px; }
    .sug-meta { display:flex; gap:6px; flex-wrap:wrap; }
    .sug-tag { padding:2px 10px; border-radius:99px; font-size:.72rem; font-weight:600; }
    .tag-type { background:var(--yellow-dim); color:var(--yellow); }
    .tag-client { background:rgba(96,165,250,0.12); color:var(--blue); }
    .tag-time { background:rgba(113,113,122,0.15); color:var(--muted); }

    .del-btn { background:transparent; border:1px solid #2a2a2a; color:#555; font-size:12px; padding:5px 10px; border-radius:7px; cursor:pointer; transition:all .2s; flex-shrink:0; font-family:'DM Sans',sans-serif; }
    .del-btn:hover { border-color:var(--red); color:var(--red); }

    .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:.88rem; }
    .empty-state .em-icon { font-size:2.5rem; margin-bottom:10px; }

    .count-badge { display:inline-flex; align-items:center; justify-content:center; background:var(--yellow); color:#000; font-size:11px; font-weight:800; min-width:20px; height:20px; border-radius:99px; padding:0 5px; margin-left:6px; }
  </style>
</head>
<body>

<button class="logout-btn" onclick="logout()">Logout</button>

<div class="sidebar">
  <div class="logo-wrap">
    <div class="logo-icon">💪</div>
    <div>
      <div class="logo-text">FIT<span>TRACK</span></div>
      <div class="logo-sub">Fitness Management</div>
    </div>
  </div>
  <ul class="menu">
    <li onclick="location.href='trainerdashboard.html'"><span class="icon">📊</span> Dashboard</li>
    <li onclick="location.href='trainer_to_client.html'"><span class="icon">👥</span> View Clients</li>
    <li class="active"><span class="icon">🏋️</span> Workout Suggestions</li>
    <li onclick="location.href='create-workout-plan.html'"><span class="icon">📝</span> Create Workout Plan</li>
  </ul>
</div>

<div class="main">
  <div class="page-head">
    <h1>💪 Workout Suggestions</h1>
    <p>Create and send personalised workout plans to your clients.</p>
  </div>

  <div class="layout">

    <!-- LEFT: COMPOSE -->
    <div class="card">
      <h2>✍️ Create Suggestion</h2>

      <div class="field">
        <label>Workout Title *</label>
        <input type="text" id="wTitle" placeholder="e.g. Full Body Strength Day" />
      </div>

      <div class="field">
        <label>Description</label>
        <textarea id="wDesc" placeholder="Describe the workout, sets/reps, tips…"></textarea>
      </div>

      <div class="field">
        <label>Workout Type</label>
        <div class="tag-grid" id="typeGrid">
          <button class="tag-pill active" data-val="Strength" onclick="pickType(this)">💪 Strength</button>
          <button class="tag-pill" data-val="Cardio" onclick="pickType(this)">🏃 Cardio</button>
          <button class="tag-pill" data-val="Flexibility" onclick="pickType(this)">🧘 Flexibility</button>
          <button class="tag-pill" data-val="HIIT" onclick="pickType(this)">🔥 HIIT</button>
          <button class="tag-pill" data-val="Recovery" onclick="pickType(this)">🛌 Recovery</button>
          <button class="tag-pill" data-val="General" onclick="pickType(this)">⚡ General</button>
        </div>
      </div>

      <div class="field">
        <label>Difficulty</label>
        <select id="wDiff">
          <option value="Beginner">Beginner</option>
          <option value="Intermediate" selected>Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>

      <div class="field">
        <label>Duration</label>
        <select id="wDur">
          <option>15 min</option>
          <option>30 min</option>
          <option selected>45 min</option>
          <option>60 min</option>
          <option>90 min</option>
        </select>
      </div>

      <div class="field">
        <label>Send To</label>
        <label class="all-row">
          <input type="checkbox" id="sendAll" onchange="toggleAll(this)" />
          <span>All my clients</span>
        </label>
        <div class="client-list" id="clientList">
          <p class="no-clients">Loading clients…</p>
        </div>
      </div>

      <button class="send-btn" onclick="sendSuggestion()">🚀 Send Workout</button>
    </div>

    <!-- RIGHT: SENT LIST -->
    <div class="card">
      <h2>
        📋 Sent Suggestions
        <span class="count-badge" id="countBadge">0</span>
      </h2>

      <div class="filter-row">
        <button class="filter-btn active" data-f="all" onclick="setFilter(this)">All</button>
        <button class="filter-btn" data-f="Strength" onclick="setFilter(this)">Strength</button>
        <button class="filter-btn" data-f="Cardio" onclick="setFilter(this)">Cardio</button>
        <button class="filter-btn" data-f="HIIT" onclick="setFilter(this)">HIIT</button>
        <button class="filter-btn" data-f="Flexibility" onclick="setFilter(this)">Flexibility</button>
        <button class="filter-btn" data-f="Recovery" onclick="setFilter(this)">Recovery</button>
        <button class="filter-btn" data-f="General" onclick="setFilter(this)">General</button>
      </div>

      <div class="suggestion-list" id="suggestionList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ Workout sent successfully!</div>

<script>
  // ── Auth ────────────────────────────────────────────────────────
  const session = JSON.parse(localStorage.getItem("fittrack_session") || "null");
  const token   = localStorage.getItem("fittrack_token");
  if (!session || session.role !== "trainer" || !token) {
    alert("Trainers only.");
    window.location.href = "index.html";
  }

  const API_URL = "http://localhost:3000/api";
  const _headers = {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token
  };

  let selectedType = "Strength";
  let currentFilter = "all";
  let myClients = [];

  // ── Pick workout type pill ──────────────────────────────────────
  function pickType(el) {
    document.querySelectorAll(".tag-pill").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
    selectedType = el.dataset.val;
  }

  // ── Load clients assigned to this trainer ──────────────────────
  async function loadClients() {
    try {
      const res = await fetch(`${API_URL}/auth/clients`, { headers: _headers });
      if (res.ok) {
        myClients = await res.json();
      }
      buildClientList();
    } catch(err) {
      console.error(err);
      document.getElementById("clientList").innerHTML = '<p class="no-clients">Error loading clients.</p>';
    }
  }

  function buildClientList() {
    const container = document.getElementById("clientList");
    if (!myClients.length) {
      container.innerHTML = '<p class="no-clients">No clients assigned to you yet.</p>';
      return;
    }
    container.innerHTML = myClients.map(c => {
      const ini = ((c.firstname || "?")[0] + (c.lastname || "?")[0]).toUpperCase();
      return `
        <label class="client-check" id="cc-${c.id}">
          <input type="checkbox" class="client-cb" value="${c.id}" onchange="syncAllCheck()" />
          <div class="cc-av">${ini}</div>
          <div class="cc-info">
            <div class="cc-name">${c.firstname} ${c.lastname}</div>
            <div class="cc-meta">@${c.username} · ${c.gender || ""} · Age ${c.age || "?"}</div>
          </div>
        </label>`;
    }).join("");

    // Highlight selected checkboxes
    container.querySelectorAll(".client-check").forEach(lbl => {
      lbl.querySelector("input").addEventListener("change", function() {
        lbl.classList.toggle("selected", this.checked);
      });
    });
  }

  function toggleAll(cb) {
    document.querySelectorAll(".client-cb").forEach(c => {
      c.checked = cb.checked;
      c.closest(".client-check").classList.toggle("selected", cb.checked);
    });
  }

  function syncAllCheck() {
    const all = document.querySelectorAll(".client-cb");
    const checked = document.querySelectorAll(".client-cb:checked");
    document.getElementById("sendAll").checked = all.length > 0 && all.length === checked.length;
  }

  // ── Send suggestion ─────────────────────────────────────────────
  async function sendSuggestion() {
    const title = document.getElementById("wTitle").value.trim();
    if (!title) { alert("Please enter a workout title."); return; }

    const sendToAll = document.getElementById("sendAll").checked;
    const selected  = [...document.querySelectorAll(".client-cb:checked")].map(c => c.value);

    if (!sendToAll && !selected.length) {
      alert("Please select at least one client (or choose All).");
      return;
    }

    const description = document.getElementById("wDesc").value.trim();
    // In db we just have duration as a string? No we don't have duration in workout table, we can append it to description.
    const difficulty = document.getElementById("wDiff").value;
    const duration = document.getElementById("wDur").value;
    const fullDesc = `${difficulty} | ${duration}\n${description}`;

    let targets = sendToAll ? ["all"] : selected;

    const btn = document.querySelector(".send-btn");
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      for (let cid of targets) {
        await fetch(`${API_URL}/workouts`, {
          method: "POST",
          headers: _headers,
          body: JSON.stringify({
            title,
            type: selectedType,
            description: fullDesc,
            clientId: cid === "all" ? null : cid
          })
        });
      }

      // Reset form
      document.getElementById("wTitle").value = "";
      document.getElementById("wDesc").value  = "";
      document.getElementById("sendAll").checked = false;
      document.querySelectorAll(".client-cb").forEach(c => {
        c.checked = false;
        c.closest(".client-check").classList.remove("selected");
      });

      showToast("✅ Workout sent!");
      renderSent();
    } catch(err) {
      console.error(err);
      alert("Failed to send suggestion");
    } finally {
      btn.disabled = false;
      btn.textContent = "🚀 Send Workout";
    }
  }

  // ── Toast ──────────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  // ── Render sent list ────────────────────────────────────────────
  function setFilter(el) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
    currentFilter = el.dataset.f;
    renderSent();
  }

  function timeAgo(ts) {
    const diff = Date.now() - new Date(ts).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1)  return "just now";
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  }

  async function renderSent() {
    try {
      const res = await fetch(`${API_URL}/workouts`, { headers: _headers });
      let mine = await res.json();
      
      if (currentFilter !== "all") {
        mine = mine.filter(w => w.type === currentFilter);
      }

      document.getElementById("countBadge").textContent = mine.length;
      const list = document.getElementById("suggestionList");

      if (!mine.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="em-icon">📭</div>
            <p>${currentFilter === "all" ? "No suggestions sent yet." : "No " + currentFilter + " suggestions."}</p>
          </div>`;
        return;
      }

      list.innerHTML = mine.map(w => {
        let clientName = w.clientId === "all" ? "All Clients" : "Client #" + w.clientId;
        if (w.clientId !== "all") {
           const found = myClients.find(c => c.id == w.clientId);
           if (found) clientName = found.firstname + " " + found.lastname;
        }

        return `
        <div class="sug-item">
          <div class="sug-dot"></div>
          <div class="sug-body">
            <div class="sug-title">${w.title}</div>
            ${w.description ? `<div class="sug-desc" style="white-space:pre-wrap;">${w.description}</div>` : ""}
            <div class="sug-meta">
              <span class="sug-tag tag-type">${w.type || "General"}</span>
              <span class="sug-tag tag-client">👤 ${clientName}</span>
              <span class="sug-tag tag-time">${timeAgo(w.createdAt)}</span>
            </div>
          </div>
          <button class="del-btn" onclick="deleteSuggestion('${w.id}')">✕</button>
        </div>`;
      }).join("");
    } catch(err) {
      console.error(err);
    }
  }

  async function deleteSuggestion(id) {
    if (!confirm("Delete this suggestion?")) return;
    try {
      await fetch(`${API_URL}/workouts/${id}`, { method: "DELETE", headers: _headers });
      renderSent();
    } catch (err) {
      console.error(err);
    }
  }

  // ── Logout ──────────────────────────────────────────────────────
  function logout() {
    localStorage.removeItem("fittrack_session");
    localStorage.removeItem("fittrack_token");
    localStorage.removeItem("isLoggedIn");
    window.location.href = "index.html";
  }

  // ── Init ────────────────────────────────────────────────────────
  loadClients().then(renderSent);
</script>
</body>
</html>
